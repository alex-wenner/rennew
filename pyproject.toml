[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rennew"
version = "0.1.0"
description = "A local-first, session-centric coding agent runtime with graph-native memory."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Alex Wenner" }]
keywords = ["agents", "coding", "graph", "memory", "llm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1,<9",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "ladybug>=0.19,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.100"]
codex = ["openai-codex>=0.1"]
anthropic = ["anthropic>=0.70"]
copilot = ["github-copilot-sdk>=1.0"]
bedrock = ["boto3>=1.35"]
providers = [
  "anthropic>=0.70",
  "boto3>=1.35",
  "github-copilot-sdk>=1.0",
  "openai>=1.100",
  "openai-codex>=0.1",
]
dev = [
  "httpx>=0.28",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[project.scripts]
ren = "rennew.cli:cli"

[project.urls]
Homepage = "https://github.com/alex-wenner/rennew"
Issues = "https://github.com/alex-wenner/rennew/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rennew"]
artifacts = ["src/rennew/web/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src/rennew", "frontend", "tests", "README.md", "ARCHITECTURE.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rennew"]

[[tool.mypy.overrides]]
module = ["ladybug", "ladybug.*", "boto3", "boto3.*", "botocore", "botocore.*", "copilot", "copilot.*", "openai_codex", "openai_codex.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
